name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Java reactor and images
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Cache OWASP dependency data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-12.2.2-feed-v1

      - name: Verify unit, integration, formatting, static-analysis, and dependency gates
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build orchestrator image without publishing
        run: >-
          docker build
          --file delivery-orchestrator/Dockerfile
          --tag le-smart-delivery/delivery-orchestrator:${GITHUB_SHA}
          --build-arg BUILD_DATE=1970-01-01T00:00:00Z
          --build-arg IMAGE_VERSION=${GITHUB_SHA}
          --build-arg VCS_REF=${GITHUB_SHA}
          .

      - name: Build simulator image without publishing
        run: >-
          docker build
          --file provider-simulator/Dockerfile
          --tag le-smart-delivery/provider-simulator:${GITHUB_SHA}
          --build-arg BUILD_DATE=1970-01-01T00:00:00Z
          --build-arg IMAGE_VERSION=${GITHUB_SHA}
          --build-arg VCS_REF=${GITHUB_SHA}
          .
